Q44-Push the landing-page HTML skeleton and base desktop styles
<!DOCTYPE html>
<html><head><style>
*{margin:0; box-sizing:border-box}
header, nav, main, footer{padding:20px}
header{background:#1e3a5f; color:white; display:flex; justify-content:space-between}
.hero{display:flex; justify-content:space-between; padding:40px; background:#eef2f7}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:20px}
.grid div{background:#fff; border:1px solid #ddd; padding:30px}
</style></head><body>
<header><div>LOGO</div><nav>Home | About | Contact</nav></header>
<div class="hero"><h1>Desktop Landing Skeleton</h1><p>Base Desktop Style</p></div>
<div class="grid"><div>Feature 1</div><div>Feature 2</div><div>Feature 3</div></div>
<footer style="background:#333;color:white;text-align:center">Footer</footer>
</body></html>
