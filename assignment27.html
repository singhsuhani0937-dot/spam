Q27- Create three differently styled card variants using border-radius and backgrounds.
<!DOCTYPE html>
<html><head><style>
body{font-family:Arial; display:flex; gap:20px; padding:20px; background:#f0f0f0;}
.card{width:200px; padding:20px; text-align:center;}
.card1{background:linear-gradient(135deg,#667eea,#764ba2); color:white; border-radius:20px;}
.card2{background:white; border:2px solid #ddd; border-radius:0; box-shadow:5px 5px 0 #000;}
.card3{background:#ff6b6b; color:white; border-radius:50px 10px 50px 10px; border:3px dashed white;}
</style></head><body>
<div class="card card1"><h3>Rounded Gradient</h3><p>Border-radius 20px</p></div>
<div class="card card2"><h3>Sharp Shadow</h3><p>Border-radius 0, Hard shadow</p></div>
<div class="card card3"><h3>Fun Shape</h3><p>Uneven radius</p></div>
</body></html>
