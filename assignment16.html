Q16- Create a student-registration form using basic input types.
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>
    <p>Please fill all the details below to register.</p>

    <form>
        <!-- Text Input -->
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

        <!-- Email Input -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required><br><br>

        <!-- Password Input -->
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Enter password" required><br><br>

        <!-- Number Input -->
        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" min="15" max="30"><br><br>

        <!-- Date Input -->
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <!-- Radio Buttons -->
        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <!-- Select Dropdown -->
        <label for="course">Select Course:</label><br>
        <select id="course" name="course">
            <option value="bca">BCA in AI</option>
            <option value="bba">BBA</option>
            <option value="bcom">B.Com</option>
            <option value="ba">BA</option>
        </select><br><br>

        <!-- Checkboxes -->
        <label>Subjects You Like:</label><br>
        <input type="checkbox" id="html" name="subject" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" id="python" name="subject" value="python">
        <label for="python">Python</label>
        <input type="checkbox" id="ai" name="subject" value="ai">
        <label for="ai">AI</label><br><br>

        <!-- File Upload -->
        <label for="photo">Upload Photo:</label><br>
        <input type="file" id="photo" name="photo"><br><br>

        <!-- Textarea -->
        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your address"></textarea><br><br>

        <!-- Buttons -->
        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">
    </form>

</body>
</html>
