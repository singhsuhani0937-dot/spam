Q29-Style a landing-page hero section using position and z-index.
<!DOCTYPE html>
<html><head><style>
* {margin:0; padding:0; box-sizing:border-box;}
.hero {position:relative; height:400px; background:#1e3a5f; overflow:hidden;}
.hero img {position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0.4; z-index:1;}
.hero-content {position:absolute; z-index:2; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; color:white;}
.hero-content h1{font-size:42px;}
.badge {position:absolute; top:20px; right:20px; background:#c9a86a; padding:8px 15px; z-index:3; border-radius:20px;}
</style></head><body>
<div class="hero">
  <img src="https://picsum.photos/800/400">
  <div class="badge">NEW</div>
  <div class="hero-content"><h1>Welcome to My Site</h1><p>Best Hero Section with z-index</p></div>
</div>
</body></html>
