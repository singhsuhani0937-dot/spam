Q36-Build a simple photo gallery using CSS Grid.
<!DOCTYPE html>
<html><head><style>
* { margin:0; box-sizing:border-box; }
body { font-family: Arial, sans-serif; padding:20px; background:#f7f5f0; }
h1 { text-align:center; margin-bottom:5px; color:#1e3a5f; }
p { text-align:center; margin-bottom:20px; color:#666; }
.gallery { display:grid; grid-template-columns:repeat(3, 1fr); gap:15px; }
.gallery figure { background:white; border-radius:12px; overflow:hidden; box-shadow:0 3px 10px rgba(0,0,0,0.1); }
.gallery img { width:100%; height:220px; object-fit:cover; display:block; }
.gallery figcaption { padding:10px; text-align:center; font-weight:bold; }
@media (max-width:600px){ .gallery{grid-template-columns:repeat(2,1fr)} }
</style></head><body>

<h1>Nature & Teddy Gallery - Q36</h1>
<p>CSS Grid Photo Gallery</p>

<div class="gallery">

  <figure>
    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=80" alt="Mountain Nature">
    <figcaption>Mountain Nature</figcaption>
  </figure>

  <figure>
    <img src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=600&q=80" alt="Cute Teddy">
    <figcaption>Cute Teddy Bear</figcaption>
  </figure>

  <figure>
    <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&q=80" alt="Foggy Nature">
    <figcaption>Foggy Hills</figcaption>
  </figure>

  <figure>
    <img src="https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?w=600&q=80" alt="Teddy Bear">
    <figcaption>Teddy With Heart</figcaption>
  </figure>

  <figure>
    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&q=80" alt="Forest">
    <figcaption>Green Forest</figcaption>
  </figure>

  <figure>
    <img src="https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=600&q=80" alt="Teddy Toy">
    <figcaption>Soft Teddy Toy</figcaption>
  </figure>

</div>
</body></html>
