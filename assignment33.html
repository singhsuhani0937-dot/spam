Q33-Build a product-listing style layout using flex-wrap.
<!DOCTYPE html>
<html><head><style>
*{margin:0;box-sizing:border-box}
body{font-family:Arial;padding:20px;background:#f5f5f5}
h1{text-align:center;margin-bottom:20px}
.products{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.product{width:200px;background:white;padding:15px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);text-align:center}
.product img{width:100%;border-radius:8px}
.product button{background:#1e3a5f;color:white;border:none;padding:8px 15px;border-radius:5px;margin-top:10px}
</style></head><body>
<h1>Product Listing</h1>
<div class="products">
<div class="product"><img src="https://picsum.photos/200/150?1"><h3>Product 1</h3><p>₹499</p><button>Add to Cart</button></div>
<div class="product"><img src="https://picsum.photos/200/150?2"><h3>Product 2</h3><p>₹699</p><button>Add to Cart</button></div>
<div class="product"><img src="https://picsum.photos/200/150?3"><h3>Product 3</h3><p>₹899</p><button>Add to Cart</button></div>
<div class="product"><img src="https://picsum.photos/200/150?4"><h3>Product 4</h3><p>₹999</p><button>Add to Cart</button></div>
</div>
</body></html>
